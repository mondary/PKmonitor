name: Dev build

# Canal dev : chaque push sur main produit un build signé, publié sur la
# release permanente `dev` et annoncé via appcast-dev.xml (commité sur main).
# Les apps en canal "dev" l'installent silencieusement via Sparkle.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dev:
    # Évite la boucle : les commits d'appcast (stable et dev) ne re-déclenchent pas.
    if: ${{ !contains(github.event.head_commit.message, 'appcast') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app (dev)
        env:
          PK_DEV_BUILD: "1"
        run: sh packaging/build_app.sh

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent PKMonitor.app PKMonitor-dev.zip

      - name: Read dev versions from built Info.plist
        id: ver
        run: |
          echo "bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/PKMonitor.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"
          echo "short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/PKMonitor.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Upload to permanent `dev` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev --prerelease \
            --title "PKMonitor dev" \
            --notes "Build automatique du canal dev (main). Installé silencieusement par les apps en canal dev." || true
          gh release upload dev dist/PKMonitor-dev.zip --clobber

      - name: Sign and publish appcast-dev.xml
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUNDLE_VERSION: ${{ steps.ver.outputs.bundle }}
          SHORT_VERSION: ${{ steps.ver.outputs.short }}
        run: |
          python3 -m venv /tmp/sv
          /tmp/sv/bin/pip -q install cryptography
          /tmp/sv/bin/python packaging/sparkle_dev_release.py \
            "dist/PKMonitor-dev.zip" "$BUNDLE_VERSION" "$SHORT_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast-dev.xml
          git commit -m "MAJ: appcast dev ($BUNDLE_VERSION)" || exit 0
          # main peut avoir avancé pendant le build (appcast stable parallèle) : rebase puis push
          git fetch origin main
          git rebase origin/main
          git push "https://x-access-token:${GH_TOKEN}@github.com/mondary/PKmonitor.git" HEAD:main
