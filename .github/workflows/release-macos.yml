name: Release macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: sh packaging/package_dmg.sh

      - name: Read version
        id: ver
        run: echo "version=$(sed -nE 's/^##? \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | sed -n 1p)" >> "$GITHUB_OUTPUT"

      - name: Verify DMG version
        run: |
          expected="${{ steps.ver.outputs.version }}"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/PKMonitor.app/Contents/Info.plist)"
          test "$actual" = "$expected"
          test -f "dist/PKMonitor-$expected.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES=$(awk 'BEGIN{p=0} /^## \[/{if(p)exit; p=1; next} p&&/^## /{exit} p' CHANGELOG.md)
          gh release create "v$VERSION" \
            --title "PKMonitor $VERSION" \
            --notes "$NOTES" \
            --verify-tag || true
          gh release upload "v$VERSION" "dist/PKMonitor-$VERSION.dmg" --clobber

      - name: Sign DMG and update appcast (Sparkle)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          awk 'BEGIN{p=0} /^## \[/{if(p)exit; p=1; next} p&&/^## /{exit} p' CHANGELOG.md > /tmp/notes.md
          python3 -m venv /tmp/sv
          /tmp/sv/bin/pip -q install cryptography
          /tmp/sv/bin/python packaging/sparkle_release.py "dist/PKMonitor-$VERSION.dmg" "$VERSION" /tmp/notes.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git commit -m "MAJ: appcast $VERSION" || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/mondary/PKmonitor.git" HEAD:main
